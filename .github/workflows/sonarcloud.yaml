name: CI e Qualidade de Código (SonarCloud)

on:
  pull_request:
    branches:
      - master
      - develop
      - release

jobs:
  sonarcloud:
    name: Testes, Lint e SonarCloud
    runs-on: ubuntu-latest
    
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Obrigatório para o SonarCloud analisar o histórico

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Lint
        run: npm run lint

      - name: Executar Testes e Gerar Cobertura
        # É crucial que seu script de teste no package.json gere a pasta de coverage
        run: npm run test:coverage 

      - name: Análise do SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}